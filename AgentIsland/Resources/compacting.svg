<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <style>
    .body { animation: tilt 1.4s ease-in-out infinite; transform-origin: 8px 5px; }
    .armL { animation: kneadL 1.4s ease-in-out infinite; }
    .armR { animation: kneadR 1.4s ease-in-out infinite; }
    .paper { animation: roll 1.4s ease-in-out infinite; transform-origin: 8px 12px; }
    @keyframes tilt {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-4deg); }
      75% { transform: rotate(4deg); }
    }
    @keyframes kneadL {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(0.3px, 0.2px); }
      75% { transform: translate(-0.3px, 0); }
    }
    @keyframes kneadR {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(-0.3px, 0); }
      75% { transform: translate(0.3px, 0.2px); }
    }
    @keyframes roll {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-0.5px) rotate(-8deg); }
      75% { transform: translateX(0.5px) rotate(8deg); }
    }
  </style>
  <g class="body">
    <!-- body plate -->
    <rect x="5" y="2" width="1" height="1" fill="#f5f5dc"/>
    <rect x="6" y="2" width="1" height="1" fill="#fffff0"/>
    <rect x="7" y="2" width="1" height="1" fill="#fffff0"/>
    <rect x="8" y="2" width="1" height="1" fill="#fffff0"/>
    <rect x="9" y="2" width="1" height="1" fill="#fffff0"/>
    <rect x="10" y="2" width="1" height="1" fill="#fffff0"/>
    <rect x="11" y="2" width="1" height="1" fill="#f5f5dc"/>
    <rect x="5" y="3" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="3" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="3" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="3" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="3" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="3" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="3" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="4" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="4" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="5" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="5" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="6" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="6" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="7" width="1" height="1" fill="#f5f5dc"/>
    <rect x="6" y="7" width="1" height="1" fill="#fffff0"/>
    <rect x="7" y="7" width="1" height="1" fill="#fffff0"/>
    <rect x="8" y="7" width="1" height="1" fill="#fffff0"/>
    <rect x="9" y="7" width="1" height="1" fill="#fffff0"/>
    <rect x="10" y="7" width="1" height="1" fill="#fffff0"/>
    <rect x="11" y="7" width="1" height="1" fill="#f5f5dc"/>
    <!-- eyes looking down -->
    <rect x="7" y="4" width="1" height="1" fill="#424242"/>
    <rect x="7" y="5" width="1" height="1" fill="#212121"/>
    <rect x="10" y="4" width="1" height="1" fill="#424242"/>
    <rect x="10" y="5" width="1" height="1" fill="#212121"/>
    <!-- slight smile -->
    <rect x="8" y="6" width="1" height="1" fill="#9e9e9e"/>
    <rect x="9" y="6" width="1" height="1" fill="#9e9e9e"/>
    <!-- cord -->
    <rect x="12" y="4" width="1" height="1" fill="#424242"/>
    <rect x="12" y="5" width="1" height="1" fill="#424242"/>
    <rect x="13" y="6" width="1" height="1" fill="#616161"/>
  </g>
  <!-- left arm -->
  <g class="armL">
    <rect x="5" y="8" width="1" height="1" fill="#e0e0e0"/>
    <rect x="5" y="9" width="1" height="1" fill="#e0e0e0"/>
    <rect x="6" y="10" width="1" height="1" fill="#e0e0e0"/>
    <rect x="7" y="11" width="1" height="1" fill="#d4d4d4"/>
  </g>
  <!-- right arm -->
  <g class="armR">
    <rect x="11" y="8" width="1" height="1" fill="#e0e0e0"/>
    <rect x="11" y="9" width="1" height="1" fill="#e0e0e0"/>
    <rect x="10" y="10" width="1" height="1" fill="#e0e0e0"/>
    <rect x="9" y="11" width="1" height="1" fill="#d4d4d4"/>
  </g>
  <!-- paper ball -->
  <g class="paper">
    <rect x="7" y="12" width="1" height="1" fill="#bdbdbd"/>
    <rect x="8" y="11" width="1" height="1" fill="#e8e8e8"/>
    <rect x="8" y="12" width="1" height="1" fill="#f5f5f5"/>
    <rect x="9" y="12" width="1" height="1" fill="#e0e0e0"/>
    <rect x="8" y="13" width="1" height="1" fill="#d4d4d4"/>
    <rect x="9" y="13" width="1" height="1" fill="#bdbdbd"/>
  </g>
</svg>
