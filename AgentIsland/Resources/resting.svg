<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <style>
    .body { animation: breathe 3s ease-in-out infinite; }
    .z1 { animation: zUp 2.8s ease-out infinite; }
    .z2 { animation: zUp 2.8s ease-out infinite 0.9s; }
    .z3 { animation: zUp 2.8s ease-out infinite 1.8s; }
    @keyframes breathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(0.2px); }
    }
    @keyframes zUp {
      0% { opacity: 0; transform: translate(0, 0); }
      15% { opacity: 1; }
      100% { opacity: 0; transform: translate(0.8px, -2.5px); }
    }
  </style>
  <g class="body">
    <rect x="5" y="4" width="1" height="1" fill="#f5f5dc"/>
    <rect x="6" y="4" width="1" height="1" fill="#fffff0"/>
    <rect x="7" y="4" width="1" height="1" fill="#fffff0"/>
    <rect x="8" y="4" width="1" height="1" fill="#fffff0"/>
    <rect x="9" y="4" width="1" height="1" fill="#fffff0"/>
    <rect x="10" y="4" width="1" height="1" fill="#fffff0"/>
    <rect x="11" y="4" width="1" height="1" fill="#f5f5dc"/>
    <rect x="5" y="5" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="5" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="6" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="6" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="7" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="7" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="8" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="8" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="8" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="8" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="8" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="8" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="8" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="9" width="1" height="1" fill="#f5f5dc"/>
    <rect x="6" y="9" width="1" height="1" fill="#fffff0"/>
    <rect x="7" y="9" width="1" height="1" fill="#fffff0"/>
    <rect x="8" y="9" width="1" height="1" fill="#fffff0"/>
    <rect x="9" y="9" width="1" height="1" fill="#fffff0"/>
    <rect x="10" y="9" width="1" height="1" fill="#fffff0"/>
    <rect x="11" y="9" width="1" height="1" fill="#f5f5dc"/>
    <!-- closed eyes -->
    <rect x="7" y="5" width="1" height="1" fill="#9e9e9e"/>
    <rect x="7" y="6" width="1" height="1" fill="#9e9e9e"/>
    <rect x="10" y="5" width="1" height="1" fill="#9e9e9e"/>
    <rect x="10" y="6" width="1" height="1" fill="#9e9e9e"/>
    <!-- mouth -->
    <rect x="8" y="8" width="1" height="1" fill="#bdbdbd"/>
    <!-- legs -->
    <rect x="6" y="10" width="1" height="1" fill="#e0e0e0"/>
    <rect x="10" y="10" width="1" height="1" fill="#e0e0e0"/>
    <!-- cord -->
    <rect x="12" y="6" width="1" height="1" fill="#424242"/>
    <rect x="12" y="7" width="1" height="1" fill="#424242"/>
    <rect x="13" y="7" width="1" height="1" fill="#616161"/>
  </g>
  <!-- zzz -->
  <g class="z1">
    <rect x="11" y="3" width="1" height="1" fill="#c5cae9"/>
    <rect x="12" y="2" width="1" height="1" fill="#c5cae9"/>
    <rect x="11" y="2" width="1" height="1" fill="#c5cae9"/>
  </g>
  <g class="z2">
    <rect x="12" y="1" width="1" height="1" fill="#9fa8da"/>
    <rect x="13" y="1" width="1" height="1" fill="#9fa8da"/>
  </g>
  <g class="z3">
    <rect x="13" y="0" width="1" height="1" fill="#7986cb"/>
  </g>
</svg>
