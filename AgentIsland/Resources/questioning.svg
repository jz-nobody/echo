<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256" shape-rendering="crispEdges">
  <style>
    .qmark { animation: fadeInOut 1.8s ease-in-out infinite; }
    .body { animation: wobble 2.5s ease-in-out infinite; }
    .eyeL { animation: lookLeft 3s ease-in-out infinite; }
    .eyeR { animation: lookLeft 3s ease-in-out infinite; }
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translateY(0.5px); }
      30% { opacity: 1; transform: translateY(0); }
      70% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-0.5px); }
    }
    @keyframes wobble {
      0%, 100% { transform: rotate(0); }
      20% { transform: rotate(-3deg); }
      40% { transform: rotate(3deg); }
      60% { transform: rotate(-1deg); }
      80% { transform: rotate(1deg); }
    }
    @keyframes lookLeft {
      0%, 40% { transform: translateX(0); }
      50% { transform: translateX(-0.3px); }
      60%, 100% { transform: translateX(0); }
    }
  </style>
  <rect width="16" height="16" fill="#000000"/>
  <g class="body">
    <!-- plate -->
    <rect x="5" y="3" width="1" height="1" fill="#f5f5dc"/>
    <rect x="6" y="3" width="1" height="1" fill="#fffff0"/>
    <rect x="7" y="3" width="1" height="1" fill="#fffff0"/>
    <rect x="8" y="3" width="1" height="1" fill="#fffff0"/>
    <rect x="9" y="3" width="1" height="1" fill="#fffff0"/>
    <rect x="10" y="3" width="1" height="1" fill="#fffff0"/>
    <rect x="11" y="3" width="1" height="1" fill="#f5f5dc"/>
    <rect x="5" y="4" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="4" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="4" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="5" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="5" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="5" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="6" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="6" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="6" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="7" width="1" height="1" fill="#fffff0"/>
    <rect x="6" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="7" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="8" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="9" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="10" y="7" width="1" height="1" fill="#ffffff"/>
    <rect x="11" y="7" width="1" height="1" fill="#fffff0"/>
    <rect x="5" y="8" width="1" height="1" fill="#f5f5dc"/>
    <rect x="6" y="8" width="1" height="1" fill="#fffff0"/>
    <rect x="7" y="8" width="1" height="1" fill="#fffff0"/>
    <rect x="8" y="8" width="1" height="1" fill="#fffff0"/>
    <rect x="9" y="8" width="1" height="1" fill="#fffff0"/>
    <rect x="10" y="8" width="1" height="1" fill="#fffff0"/>
    <rect x="11" y="8" width="1" height="1" fill="#f5f5dc"/>
    <!-- eyes looking left -->
    <g class="eyeL">
      <rect x="6" y="4" width="1" height="1" fill="#212121"/>
      <rect x="6" y="5" width="1" height="1" fill="#212121"/>
    </g>
    <g class="eyeR">
      <rect x="9" y="4" width="1" height="1" fill="#212121"/>
      <rect x="9" y="5" width="1" height="1" fill="#212121"/>
    </g>
    <!-- mouth - wavy confused -->
    <rect x="7" y="7" width="1" height="1" fill="#9e9e9e"/>
    <rect x="8" y="7" width="1" height="1" fill="#616161"/>
    <rect x="9" y="7" width="1" height="1" fill="#9e9e9e"/>
    <!-- legs -->
    <rect x="6" y="9" width="1" height="1" fill="#f5f5dc"/>
    <rect x="6" y="10" width="1" height="1" fill="#e0e0e0"/>
    <rect x="10" y="9" width="1" height="1" fill="#f5f5dc"/>
    <rect x="10" y="10" width="1" height="1" fill="#e0e0e0"/>
    <!-- cord -->
    <rect x="12" y="5" width="1" height="1" fill="#424242"/>
    <rect x="13" y="6" width="1" height="1" fill="#424242"/>
    <rect x="13" y="7" width="1" height="1" fill="#424242"/>
  </g>
  <!-- question mark with fade animation -->
  <g class="qmark">
    <rect x="2" y="2" width="1" height="1" fill="#ff1744"/>
    <rect x="3" y="2" width="1" height="1" fill="#ff1744"/>
    <rect x="4" y="2" width="1" height="1" fill="#ff1744"/>
    <rect x="4" y="3" width="1" height="1" fill="#ff1744"/>
    <rect x="3" y="4" width="1" height="1" fill="#ff5252"/>
    <rect x="3" y="5" width="1" height="1" fill="#ff1744"/>
    <rect x="3" y="7" width="1" height="1" fill="#ff1744"/>
  </g>
</svg>
